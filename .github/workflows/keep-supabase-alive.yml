name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 0 */3 * *' # Ping every 3 days at 00:00 UTC
  workflow_dispatch:      # Enable manual trigger from GitHub Actions tab

permissions:
  contents: read

concurrency:
  group: keep-supabase-alive
  cancel-in-progress: true

jobs:
  ping-supabase:
    name: Ping Supabase Keep-Alive Table
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Validate Supabase secrets
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::CRITICAL: Missing SUPABASE_URL or SUPABASE_ANON_KEY secret in GitHub repository settings!"
            echo "Supabase requires SUPABASE_URL and SUPABASE_ANON_KEY secrets to query the keep_alive table and prevent database pausing."
            exit 1
          fi

      - name: Query keep_alive table via PostgREST
        run: |
          URL="${SUPABASE_URL}/rest/v1/keep_alive?select=*"
          HTTP_STATUS=$(curl -f -s -o /dev/null -w "%{http_code}" \
            -X GET "$URL" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json")

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Successfully pinged Supabase keep_alive table (HTTP $HTTP_STATUS)."
          else
            echo "::error::Failed to reach Supabase keep_alive table. HTTP status: $HTTP_STATUS"
            exit 1
          fi
