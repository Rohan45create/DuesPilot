spring:
  application:
    name: duespilot-api
  config:
    import:
      - "optional:file:../../.env[.properties]"
      - "optional:file:../.env[.properties]"
      - "optional:file:.env[.properties]"
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/duespilot}}
    username: ${SPRING_DATASOURCE_USERNAME:duespilot}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 10000
      schema: app
      data-source-properties:
        prepareThreshold: 0
  flyway:
    enabled: true
    url: ${DATABASE_URL_DIRECT:${spring.datasource.url}}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
    default-schema: app
    schemas: app,public
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 4

  lifecycle:
    timeout-per-shutdown-phase: 30s
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

duespilot:
  demo-mode: ${DEMO_MODE:replay}
  auth:
    supabase-url: ${SUPABASE_URL:https://gkaeiociqcjsbjfgdofi.supabase.co}
    jwks-uri: ${SUPABASE_JWKS_URI:https://gkaeiociqcjsbjfgdofi.supabase.co/auth/v1/.well-known/jwks.json}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080}
  rate-limit:
    requests-per-minute: ${RATE_LIMIT_RPM:60}
  retention:
    cron: ${RETENTION_CRON:0 0 2 * * *}
  storage:
    directory: ${STORAGE_DIR:./data/uploads}
  tavily:
    base-url: ${TAVILY_BASE_URL:https://api.tavily.com}
    api-key: ${TAVILY_API_KEY:}
    timeout-ms: ${TAVILY_TIMEOUT_MS:15000}
  llm:
    base-url: ${LLM_BASE_URL:https://api.tokenfactory.nebius.com/v1}
    api-key: ${NEBIUS_API_KEY:}
    max-inflight: ${LLM_MAX_INFLIGHT:10}
    daily-cost-cap-micros: ${DAILY_COST_CAP_MICROS:50000000}       # $50.00
    per-case-cost-cap-micros: ${PER_CASE_COST_CAP_MICROS:2000000}   # $2.00
    timeout-ms: ${LLM_TIMEOUT_MS:30000}
    max-retries: ${LLM_MAX_RETRIES:3}
    models:
      extract:
        id: "nvidia/nemotron-nano-3-30b-a3b"
        context-limit: 32768
        input-cost-per-million-micros: 200000   # $0.20 per 1M input tokens
        output-cost-per-million-micros: 400000  # $0.40 per 1M output tokens
        default-max-tokens: 512
        expanded-max-tokens: 2048
      reason:
        id: "nvidia/nemotron-3-super-120b-a12b"
        context-limit: 131072
        input-cost-per-million-micros: 800000   # $0.80 per 1M input tokens
        output-cost-per-million-micros: 2400000 # $2.40 per 1M output tokens
        default-max-tokens: 4096
        expanded-max-tokens: 8192
      adjudicate:
        id: "nvidia/nemotron-3-ultra-550b-a55b"
        context-limit: 131072
        input-cost-per-million-micros: 3000000  # $3.00 per 1M input tokens
        output-cost-per-million-micros: 9000000 # $9.00 per 1M output tokens
        default-max-tokens: 4096
        expanded-max-tokens: 8192
  notifications:
    sandbox: ${NOTIFY_SANDBOX:false}
    sandbox-email: ${NOTIFY_SANDBOX_EMAIL:owner@duespilot.local}
    sandbox-phone: ${NOTIFY_SANDBOX_PHONE:+919999999999}
    resend:
      base-url: ${RESEND_BASE_URL:https://api.resend.com}
      api-key: ${RESEND_API_KEY:}
      from-email: ${RESEND_FROM_EMAIL:onboarding@resend.dev}
      webhook-secret: ${RESEND_WEBHOOK_SECRET:}
    whatsapp:
      base-url: ${WHATSAPP_BASE_URL:https://graph.facebook.com}
      api-enabled: ${WHATSAPP_API_ENABLED:false}
      phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
      access-token: ${WHATSAPP_TOKEN:${WHATSAPP_ACCESS_TOKEN:}}
      verify-token: ${WHATSAPP_VERIFY_TOKEN:}
      app-secret: ${WHATSAPP_APP_SECRET:}

