services:
  postgres:
    image: postgres:16-alpine
    container_name: duespilot-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-duespilot}
      POSTGRES_USER: ${POSTGRES_USER:-duespilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-duespilot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-duespilot} -d ${POSTGRES_DB:-duespilot}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: duespilot-app
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-duespilot}
      DATABASE_URL_DIRECT: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-duespilot}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-duespilot}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-duespilot}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-duespilot}
      PORT: 8080
      DEMO_MODE: ${DEMO_MODE:-replay}
      RATE_LIMIT_RPM: ${RATE_LIMIT_RPM:-60}
      NEBIUS_API_KEY: ${NEBIUS_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      DAILY_COST_CAP_MICROS: ${DAILY_COST_CAP_MICROS:-50000000}
      PER_CASE_COST_CAP_MICROS: ${PER_CASE_COST_CAP_MICROS:-2000000}
      LLM_MAX_INFLIGHT: ${LLM_MAX_INFLIGHT:-8}
      STORAGE_DIR: /app/data/uploads
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - app_uploads:/app/data/uploads

volumes:
  postgres_data:
    name: duespilot_postgres_data
  app_uploads:
    name: duespilot_app_uploads
